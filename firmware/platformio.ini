; 厨房菜单屏固件（合宙 ESP32-C3 + UC8179 7.5 寸三色屏），说明见 README.md
[env:epd]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
; 这块板的 Flash（厂商 0x5e）只能跑 DIO，默认的 QIO 会让 OTA 校验读出乱码、自编 bootloader 无限重启
board_build.flash_mode = dio
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
; 编译时默认值从环境变量 MENU_WIFI_SSID / MENU_WIFI_PASS / MENU_SERVER 读，见 scripts/env_defaults.py
extra_scripts = pre:scripts/env_defaults.py
lib_deps = zinggjm/GxEPD2@1.6.2
